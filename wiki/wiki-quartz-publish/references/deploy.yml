name: Deploy Quartz Site

on:
  repository_dispatch:
    types:
      - content-updated
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: wiki-site-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout site repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve content ref
        id: content
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "repo=${{ github.event.client_payload.content_repo }}" >> "$GITHUB_OUTPUT"
            echo "sha=${{ github.event.client_payload.content_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "repo=YOUR_USERNAME/content-repo" >> "$GITHUB_OUTPUT"
            echo "sha=main" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout content repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.content.outputs.repo }}
          ref: ${{ steps.content.outputs.sha }}
          token: ${{ secrets.CONTENT_REPO_READ_TOKEN }}
          path: external/content

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run sync tests
        run: node --test scripts/sync-content.test.mjs

      - name: Sync content
        run: node scripts/sync-content.mjs --source external/content --target content

      - name: Build Quartz
        env:
          QUARTZ_BASE_URL: ${{ vars.QUARTZ_BASE_URL }}
        run: npx quartz build

      # cf reads cloudflare.config.ts (worker name, assets); see SKILL.md
      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx cf deploy

      - name: Write summary
        run: |
          {
            echo "## Quartz deployment"
            echo ""
            echo "- content_repo: ${{ steps.content.outputs.repo }}"
            echo "- content_sha: ${{ steps.content.outputs.sha }}"
            echo "- worker: your-wiki"
          } >> "$GITHUB_STEP_SUMMARY"
