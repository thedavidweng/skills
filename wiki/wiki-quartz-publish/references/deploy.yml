name: Deploy Quartz Site

on:
  repository_dispatch:
    types:
      - content-updated
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: wiki-site-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout site repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve content ref
        id: content
        env:
          EVENT_NAME: ${{ github.event_name }}
          CONTENT_REPO: ${{ github.event.client_payload.content_repo }}
          CONTENT_SHA: ${{ github.event.client_payload.content_sha }}
        run: |
          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            [[ "$CONTENT_REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
            [[ "$CONTENT_SHA" =~ ^[a-fA-F0-9]{40}$ ]]
            echo "repo=$CONTENT_REPO" >> "$GITHUB_OUTPUT"
            echo "sha=$CONTENT_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "repo=YOUR_USERNAME/content-repo" >> "$GITHUB_OUTPUT"
            echo "sha=main" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout content repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.content.outputs.repo }}
          ref: ${{ steps.content.outputs.sha }}
          token: ${{ secrets.CONTENT_REPO_READ_TOKEN }}
          path: external/content
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run sync tests
        run: node --test scripts/sync-content.test.mjs

      - name: Sync content
        run: node scripts/sync-content.mjs --source external/content --target content

      - name: Build Quartz
        env:
          QUARTZ_BASE_URL: ${{ vars.QUARTZ_BASE_URL }}
        run: npx quartz build

      # cf reads cloudflare.config.ts (worker name, assets); see SKILL.md
      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx cf deploy

      - name: Write summary
        env:
          CONTENT_REPO: ${{ steps.content.outputs.repo }}
          CONTENT_SHA: ${{ steps.content.outputs.sha }}
        run: |
          {
            echo "## Quartz deployment"
            echo ""
            echo "- content_repo: $CONTENT_REPO"
            echo "- content_sha: $CONTENT_SHA"
            echo "- worker: your-wiki"
          } >> "$GITHUB_STEP_SUMMARY"
